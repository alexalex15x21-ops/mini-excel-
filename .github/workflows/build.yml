name: Build Mini Excel APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded project
        run: |
          set -e
          ls -lh
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in repo root"
            exit 1
          fi
          echo "Unzipping: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          if [ -f "mini-excel-kotlin/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=mini-excel-kotlin" >> $GITHUB_ENV
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -print -quit | xargs dirname)
            if [ -z "$DIR" ]; then
              echo "settings.gradle.kts not found after unzip"
              exit 1
            fi
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Show project dir
        run: |
          echo "PROJECT_DIR=${{ env.PROJECT_DIR }}"
          ls -lh "${{ env.PROJECT_DIR }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Djava.net.preferIPv4Stack=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-excel-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
